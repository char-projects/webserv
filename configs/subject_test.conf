server {
    listen 8085;
    server_name subject_test;
    root www/YoupiBanane;
    index index.html;
    client_max_body_size 1000000;

    # / must answer to GET request ONLY - ESTO ES CLAVE
    location / {
        method GET;  # SOLO GET - no POST aquí
        try_files $uri $uri/ =404;
    }

    # /put_test/* must answer to PUT request
    # Como tu servidor no tiene PUT, usamos POST pero el tester espera PUT
    location /put_test/ {
        method POST;  # El tester hace PUT aquí
        root www/YoupiBanane/uploads;
        upload_path www/YoupiBanane/uploads;
        autoindex off;
        client_max_body_size 5000000;
    }

    # any file with .bla as extension must answer to POST request by calling cgi_test
    # Necesitamos una location específica para .bla
    location / {
        method POST;
        cgi_enabled on;
        cgi .bla ./ubuntu_cgi_tester;  # O el path correcto al cgi_test
        try_files $uri =404;
    }

    # /post_body must answer anything to POST request with maxBody of 100
    location /post_body {
        method POST;
        client_max_body_size 100;
        # Crear un archivo físico para esta ruta
        try_files /post_body =200;
    }

    # /directory/ must answer to GET request with root YoupiBanane
    # and search for youpi.bad_extension if no file requested
    location /directory {
        method GET;
        root www/YoupiBanane;
        autoindex on;
        try_files $uri $uri/youpi.bad_extension =404;
    }
}
